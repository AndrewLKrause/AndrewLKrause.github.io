<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Andrew Krause</title>
    <style>
      :root {
        color-scheme: light;
        --bg: #f8f9fb;
        --panel: #ffffff;
        --text: #1d1d1d;
        --muted: #5b6472;
        --accent: #002855;
      }
      * { box-sizing: border-box; }
      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        font-family: Arial, Helvetica, sans-serif;
        background: var(--bg);
        color: var(--text);
      }
      .card {
        width: min(90vw, 560px);
        background: var(--panel);
        border: 1px solid #e5e7eb;
        border-radius: 12px;
        box-shadow: 0 8px 24px rgba(0, 0, 0, 0.06);
        padding: 2.5rem 2rem;
        text-align: center;
      }
      h1 {
        margin: 0 0 1rem;
        font-size: clamp(2rem, 5vw, 2.5rem);
        color: var(--accent);
      }
      p {
        margin: 0;
        color: var(--muted);
        font-size: 1.05rem;
      }
      a {
        color: var(--accent);
        text-decoration: none;
        font-weight: 600;
      }
      a:hover { text-decoration: underline; }
    </style>
  </head>
  <body>
    <main class="card">
      <h1>Andrew Krause</h1>
      <p><a href="slides/">Open the slides</a></p>
    </main>
  </body>
</html>
